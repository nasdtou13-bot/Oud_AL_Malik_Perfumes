              <button
                onClick={() => onRequestScent(perfume, currentSize)}
                className="w-full py-3.5 px-4 rounded-xl bg-[#1C1614] hover:bg-[#C59A47] text-[#FAF7F2] text-xs font-sans font-medium uppercase tracking-[0.2em] transition-all duration-300 shadow-sm hover:shadow-md flex items-center justify-center gap-2 group/btn"
              >
                <span>Request this Scent</span>
                <svg className="w-4 h-4 text-[#C59A47] group-hover/btn:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // SUBCOMPONENT: OLFACTORY PYRAMID MODAL
    function OlfactoryModalView({ perfume, onClose, onRequestFromModal, activeCurrency }) {
      const currencyInfo = BRAND_CONFIG.currencies[activeCurrency] || BRAND_CONFIG.currencies.USD;
      const basePrice = Math.round(perfume.sizes[0].priceUSD * currencyInfo.rate);

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/65 backdrop-blur-sm flex items-center justify-center p-4 sm:p-6 animate-fadeIn">
          <div 
            className="relative bg-[#FAF7F2] rounded-3xl max-w-3xl w-full border border-[#D5C7B4] shadow-2xl overflow-hidden my-8 max-h-[92vh] flex flex-col"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center justify-between px-6 sm:px-8 py-5 border-b border-[#E8DFD3] bg-[#FAF7F2]">
              <div>
                <span className="text-[10px] font-sans uppercase tracking-[0.25em] text-[#C59A47] block font-medium">
                  Olfactory Anatomy & Story
                </span>
                <h2 className="font-serif text-2xl sm:text-3xl text-[#1C1614] font-normal">
                  {perfume.name}
                </h2>
              </div>
              <button
                onClick={onClose}
                className="w-9 h-9 rounded-full bg-[#EFE7D8] hover:bg-[#1C1614] text-[#6E5E52] hover:text-[#FAF7F2] flex items-center justify-center transition-all"
              >
                ✕
              </button>
            </div>

            <div className="overflow-y-auto p-6 sm:p-8 space-y-8 flex-1">
              <div className="grid grid-cols-1 sm:grid-cols-12 gap-6 items-center bg-[#F4EFE6] p-4 sm:p-5 rounded-2xl border border-[#DFD3C2]">
                <div className="sm:col-span-4 rounded-xl overflow-hidden aspect-[4/5] bg-stone-900 shadow-md">
                  <img src={perfume.image} alt={perfume.name} className="w-full h-full object-cover" />
                </div>
                <div className="sm:col-span-8 space-y-3">
                  <span className="inline-block px-3 py-1 rounded-full text-xs font-sans uppercase tracking-wider bg-[#1C1614] text-[#FAF6F0]">
                    {perfume.vibeLabel}
                  </span>
                  <p className="font-serif text-lg text-[#C59A47]" dir="rtl">{perfume.arabicName}</p>
                  <p className="text-sm text-[#4E4137] font-sans italic">"{perfume.inspiration}"</p>
                  <div className="pt-2 grid grid-cols-2 gap-3 text-xs font-sans text-[#6B5B4E]">
                    <div><span className="font-semibold text-[#1C1614] block">Longevity:</span> {perfume.characteristics.longevity}</div>
                    <div><span className="font-semibold text-[#1C1614] block">Sillage:</span> {perfume.characteristics.sillage}</div>
                  </div>
                </div>
              </div>

              {/* Olfactory Pyramid */}
              <div className="space-y-3">
                <h3 className="font-serif text-2xl text-center text-[#1C1614]">The Olfactory Pyramid</h3>

                {/* Top */}
                <div className="bg-[#FAF6F0] p-4 rounded-2xl border border-[#E3D6C5]">
                  <div className="flex items-center justify-between mb-1">
                    <span className="font-serif text-lg text-[#1C1614] font-medium">1. Top Notes (The Sparkle · 0–30 Mins)</span>
                  </div>
                  <div className="flex flex-wrap gap-2 mt-2">
                    {perfume.notes.top.map((n, i) => (
                      <span key={i} className="text-xs font-sans px-3 py-1.5 rounded-full bg-[#F3ECE1] text-[#2D231E] border border-[#DDD0BF]">
                        ✦ {n}
                      </span>
                    ))}
                  </div>
                </div>

                {/* Heart */}
                <div className="bg-[#FAF6F0] p-4 rounded-2xl border border-[#E3D6C5]">
                  <div className="flex items-center justify-between mb-1">
                    <span className="font-serif text-lg text-[#1C1614] font-medium">2. Heart Notes (The Soul · 30m–6h)</span>
                  </div>
                  <div className="flex flex-wrap gap-2 mt-2">
                    {perfume.notes.heart.map((n, i) => (
                      <span key={i} className="text-xs font-sans px-3 py-1.5 rounded-full bg-[#F3ECE1] text-[#2D231E] border border-[#DDD0BF]">
                        ✦ {n}
                      </span>
                    ))}
                  </div>
                </div>

                {/* Base */}
                <div className="bg-[#FAF6F0] p-4 rounded-2xl border border-[#E3D6C5]">
                  <div className="flex items-center justify-between mb-1">
                    <span className="font-serif text-lg text-[#1C1614] font-medium">3. Base Notes (The Lingering Memory · 6–24+ Hours)</span>
                  </div>
                  <div className="flex flex-wrap gap-2 mt-2">
                    {perfume.notes.base.map((n, i) => (
                      <span key={i} className="text-xs font-sans px-3 py-1.5 rounded-full bg-[#F3ECE1] text-[#2D231E] border border-[#DDD0BF]">
                        ✦ {n}
                      </span>
                    ))}
                  </div>
                </div>
              </div>

              {/* Story */}
              <div className="bg-[#FAF7F2] border border-[#E5DACD] p-5 rounded-2xl">
                <h4 className="font-serif text-lg text-[#1C1614] mb-1">Formulation Story</h4>
                <p className="text-sm text-[#5E5147] font-sans font-light leading-relaxed">
                  {perfume.story}
                </p>
              </div>
            </div>

            {/* Sticky Action */}
            <div className="px-6 sm:px-8 py-4 border-t border-[#E8DFD3] bg-[#FAF7F2] flex items-center justify-between">
              <span className="font-serif text-xl font-medium text-[#1C1614]">
                {currencyInfo.symbol}{basePrice.toLocaleString()} ({perfume.sizes[0].size})
              </span>
              <button
                onClick={() => {
                  onClose();
                  onRequestFromModal(perfume, perfume.sizes[0]);
                }}
                className="px-6 py-3 rounded-full bg-[#1C1614] hover:bg-[#C59A47] text-[#FAF7F2] text-xs font-sans font-medium uppercase tracking-[0.2em] transition-all"
              >
                Request Scent via Concierge →
              </button>
            </div>
          </div>
        </div>
      );
    }

    // SUBCOMPONENT: 'REQUEST A SCENT' INQUIRY MODAL
    function InquiryModalView({ perfume, initialSize, activeCurrency, onClose }) {
      const [activeTab, setActiveTab] = useState('whatsapp');
      const [selectedSize, setSelectedSize] = useState(initialSize || perfume.sizes[0]);
      const [customerName, setCustomerName] = useState('');
      const [customerEmail, setCustomerEmail] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [customerNotes, setCustomerNotes] = useState('');
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [inquiryRef, setInquiryRef] = useState('');

      const currencyInfo = BRAND_CONFIG.currencies[activeCurrency] || BRAND_CONFIG.currencies.USD;
      const currentPrice = Math.round(selectedSize.priceUSD * currencyInfo.rate);

      const generateWhatsAppMessage = () => {
        return `Hello Oud Al Malik Concierge,\n\nI would like to inquire about ordering:\n✦ Scent: ${perfume.name} (${perfume.arabicName})\n✦ Size: ${selectedSize.size} Extrait de Parfum\n✦ Price: ${currencyInfo.symbol}${currentPrice.toLocaleString()}\n${customerName ? `✦ My Name: ${customerName}\n` : ''}${customerNotes ? `✦ Note: ${customerNotes}\n` : ''}\nPlease let me know about availability and shipping details. Thank you!`;
      };

      const whatsappUrl = `https://wa.me/${BRAND_CONFIG.contact.whatsappNumber}?text=${encodeURIComponent(generateWhatsAppMessage())}`;

      const handleEmailSubmit = (e) => {
        e.preventDefault();
        setInquiryRef(`OAM-${Math.floor(1000 + Math.random() * 9000)}`);
        setIsSubmitted(true);
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/65 backdrop-blur-sm flex items-center justify-center p-4 sm:p-6 animate-fadeIn">
          <div 
            className="relative bg-[#FAF7F2] rounded-3xl max-w-2xl w-full border border-[#D5C7B4] shadow-2xl overflow-hidden my-8"
            onClick={(e) => e.stopPropagation()}
          >
            {/* Header */}
            <div className="flex items-center justify-between px-6 sm:px-8 py-5 border-b border-[#E8DFD3] bg-[#FAF7F2]">
              <div>
                <span className="text-[10px] font-sans uppercase tracking-[0.25em] text-[#C59A47] block font-medium">
                  Bespoke Concierge Flow
                </span>
                <h2 className="font-serif text-2xl sm:text-3xl text-[#1C1614] font-normal">
                  Request a Scent
                </h2>
              </div>
              <button
                onClick={onClose}
                className="w-9 h-9 rounded-full bg-[#EFE7D8] hover:bg-[#1C1614] text-[#6E5E52] hover:text-[#FAF7F2] flex items-center justify-center transition-all"
              >
                ✕
              </button>
            </div>

            {/* Selected Perfume Summary */}
            <div className="bg-[#F4EFE6] px-6 sm:px-8 py-4 border-b border-[#E3D8C8] flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div className="flex items-center gap-4">
                <img
                  src={perfume.image}
                  alt={perfume.name}
                  className="w-14 h-14 rounded-xl object-cover border border-[#D0C2AE]"
                />
                <div>
                  <span className="text-[10px] font-sans uppercase tracking-wider text-[#9E5336] font-medium">
                    {perfume.vibeLabel}
                  </span>
                  <h3 className="font-serif text-xl text-[#1C1614] font-medium leading-tight">
                    {perfume.name}
                  </h3>
                  <p className="text-xs text-[#7A6C60] font-sans">
                    {perfume.subtitle}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-4 sm:flex-col sm:items-end justify-between">
                <div className="flex items-center gap-1 bg-[#EAE2D4] p-1 rounded-full border border-[#D5C7B4]">
                  {perfume.sizes.map((s) => (
                    <button
                      key={s.size}
                      type="button"
                      onClick={() => setSelectedSize(s)}
                      className={`px-2.5 py-0.5 rounded-full text-xs font-sans transition-all ${
                        selectedSize.size === s.size
                          ? 'bg-[#1C1614] text-[#FAF6F0] font-medium'
                          : 'text-[#6E5F55] hover:text-[#1C1614]'
                      }`}
                    >
                      {s.size}
                    </button>
                  ))}
                </div>
                <div className="text-right">
                  <span className="font-serif text-2xl font-medium text-[#1C1614]">
                    {currencyInfo.symbol}{currentPrice.toLocaleString()}
                  </span>
                </div>
              </div>
            </div>

            {/* Modal Body */}
            {isSubmitted ? (
              <div className="p-8 sm:p-12 text-center space-y-6">
                <div className="w-16 h-16 rounded-full bg-[#EAE2D4] text-[#C59A47] flex items-center justify-center mx-auto border border-[#C59A47]/40">
                  ✓
                </div>
                <div className="space-y-2">
                  <span className="text-xs font-sans uppercase tracking-[0.25em] text-[#C59A47] font-medium">
                    Inquiry Received
                  </span>
                  <h3 className="font-serif text-3xl text-[#1C1614]">
                    Thank You, {customerName || 'Esteemed Patron'}
                  </h3>
                  <p className="text-sm font-sans text-[#6B5C52] max-w-md mx-auto leading-relaxed">
                    Your scent request for <span className="font-medium text-[#1C1614]">{perfume.name} ({selectedSize.size})</span> has been submitted to the atelier.
                  </p>
                </div>
                <div className="bg-[#F5EFEB] p-4 rounded-2xl border border-[#DFD3C2] max-w-sm mx-auto text-xs font-sans text-[#6B5C52] space-y-1">
                  <p><span className="font-medium text-[#1C1614]">Inquiry Reference:</span> {inquiryRef}</p>
                  <p><span className="font-medium text-[#1C1614]">Estimated Response:</span> Within 2 to 4 business hours</p>
                </div>
                <div className="pt-2 flex flex-col sm:flex-row items-center justify-center gap-3">
                  <a
                    href={whatsappUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full sm:w-auto px-6 py-3 rounded-full bg-[#1C1614] hover:bg-[#C59A47] text-[#FAF7F2] text-xs font-sans uppercase tracking-widest font-medium"
                  >
                    Speed Up via WhatsApp
                  </a>
                  <button
                    onClick={onClose}
                    className="w-full sm:w-auto px-6 py-3 rounded-full border border-[#3C312A] text-[#1C1614] text-xs font-sans uppercase tracking-widest font-medium"
                  >
                    Return to Collection
                  </button>
                </div>
              </div>
            ) : (
              <div className="p-6 sm:p-8 space-y-6">
                <div className="grid grid-cols-2 p-1 bg-[#EFE8DD] rounded-2xl border border-[#D5C7B4]">
                  <button
                    type="button"
                    onClick={() => setActiveTab('whatsapp')}
                    className={`py-3 px-4 rounded-xl text-xs font-sans tracking-wider uppercase font-medium transition-all ${
                      activeTab === 'whatsapp' ? 'bg-[#1C1614] text-[#FAF6F0] shadow-sm' : 'text-[#66574D]'
                    }`}
                  >
                    Instant WhatsApp
                  </button>
                  <button
                    type="button"
                    onClick={() => setActiveTab('email')}
                    className={`py-3 px-4 rounded-xl text-xs font-sans tracking-wider uppercase font-medium transition-all ${
                      activeTab === 'email' ? 'bg-[#1C1614] text-[#FAF6F0] shadow-sm' : 'text-[#66574D]'
                    }`}
                  >
                    Email Concierge
                  </button>
                </div>

                {activeTab === 'whatsapp' ? (
                  <div className="space-y-5">
                    <div className="bg-[#FAF6F0] p-5 rounded-2xl border border-[#DFD3C2] space-y-3">
                      <p className="text-xs text-[#6B5C52] font-sans">
                        Clicking below opens your WhatsApp directly with this prefilled inquiry message:
                      </p>
                      <div className="bg-[#F2ECE1] p-4 rounded-xl border border-[#D5C8B7] font-mono text-xs text-[#2D231E] whitespace-pre-wrap leading-relaxed">
                        {generateWhatsAppMessage()}
                      </div>
                    </div>

                    <div className="space-y-1">
                      <label className="text-[11px] font-sans uppercase tracking-wider text-[#66574D] block">
                        Your Name (Optional)
                      </label>
                      <input
                        type="text"
                        value={customerName}
                        onChange={(e) => setCustomerName(e.target.value)}
                        placeholder="e.g. Sarah or Tariq"
                        className="w-full px-4 py-2.5 bg-[#FAF6F0] border border-[#D0C2AE] rounded-xl text-sm font-sans focus:outline-none focus:ring-1 focus:ring-[#C59A47]"
                      />
                    </div>

                    <a
                      href={whatsappUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="w-full py-4 rounded-2xl bg-[#1C1614] hover:bg-[#25D366] text-white text-xs font-sans font-medium uppercase tracking-[0.2em] transition-all flex items-center justify-center gap-3 shadow-lg"
                    >
                      <span>Launch WhatsApp to Inquire</span>
                    </a>
                  </div>
                ) : (
                  <form onSubmit={handleEmailSubmit} className="space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="space-y-1">
                        <label className="text-[11px] font-sans uppercase tracking-wider text-[#66574D] block font-medium">
                          Your Name *
                        </label>
                        <input
                          type="text"
                          required
                          value={customerName}
                          onChange={(e) => setCustomerName(e.target.value)}
                          placeholder="Full Name"
                          className="w-full px-4 py-2.5 bg-[#FAF6F0] border border-[#D0C2AE] rounded-xl text-sm font-sans focus:outline-none focus:ring-1 focus:ring-[#C59A47]"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="text-[11px] font-sans uppercase tracking-wider text-[#66574D] block font-medium">
                          Email Address *
                        </label>
                        <input
                          type="email"
                          required
                          value={customerEmail}
                          onChange={(e) => setCustomerEmail(e.target.value)}
                          placeholder="client@domain.com"
                          className="w-full px-4 py-2.5 bg-[#FAF6F0] border border-[#D0C2AE] rounded-xl text-sm font-sans focus:outline-none focus:ring-1 focus:ring-[#C59A47]"
                        />
                      </div>
                    </div>

                    <div className="space-y-1">
                      <label className="text-[11px] font-sans uppercase tracking-wider text-[#66574D] block">
                        Phone / City
                      </label>
                      <input
                        type="text"
                        value={customerPhone}
                        onChange={(e) => setCustomerPhone(e.target.value)}
                        placeholder="+971 ... or London, UK"
                        className="w-full px-4 py-2.5 bg-[#FAF6F0] border border-[#D0C2AE] rounded-xl text-sm font-sans focus:outline-none focus:ring-1 focus:ring-[#C59A47]"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="text-[11px] font-sans uppercase tracking-wider text-[#66574D] block">
                        Special Requests or Gifting Notes
                      </label>
                      <textarea
                        rows={3}
                        value={customerNotes}
                        onChange={(e) => setCustomerNotes(e.target.value)}
                        placeholder="Custom engraving, sample requests, or delivery date inquiries..."
                        className="w-full px-4 py-2.5 bg-[#FAF6F0] border border-[#D0C2AE] rounded-xl text-sm font-sans focus:outline-none focus:ring-1 focus:ring-[#C59A47] resize-none"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-4 rounded-2xl bg-[#1C1614] hover:bg-[#C59A47] text-[#FAF7F2] text-xs font-sans font-medium uppercase tracking-[0.2em] transition-all shadow-md"
                    >
                      Submit Scent Inquiry to Atelier
                    </button>
                  </form>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // 4. RENDER REACT APPLICATION INTO ROOT
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
